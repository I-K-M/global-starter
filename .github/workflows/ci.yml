name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm payload:generate
        env:
          PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/global_starter
      - run: pnpm typecheck
      - run: pnpm build
        env:
          PAYLOAD_SECRET: ci-only-secret-ci-only-secret-ci-only
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/global_starter
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
